  <g transform="translate(-35.12 0)"><path d="M182.43 26.80L178.84 30.39L178.23 29.78L181.82 26.19L182.32 25.93L182.26 25.78L181.60 25.96L180.11 25.96L180.11 25.10L182.70 25.10L183.52 25.92L183.52 28.51L182.66 28.51L182.66 27.02L182.84 26.36L182.69 26.30L182.43 26.80Z" fill="#e8100c"/></g>
</svg>
