  <path d="M172.44 26.80L168.86 30.39L168.24 29.78L171.83 26.19L172.34 25.93L172.28 25.78L171.62 25.96L170.13 25.96L170.13 25.10L172.72 25.10L173.54 25.92L173.54 28.51L172.67 28.51L172.67 27.02L172.85 26.36L172.71 26.30L172.44 26.80Z" fill="#e8100c"/>
</svg>
