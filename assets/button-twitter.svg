<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" role="img" aria-labelledby="t">
<title id="t">Twitter</title>
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feFlood flood-color="#e8100c" flood-opacity="0.55"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="frameGlow" x="-5%" y="-10%" width="110%" height="120%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feFlood flood-color="#e8100c" flood-opacity="0.22"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feFlood flood-color="#f2f0ec" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="redSilhouette" x="0" y="0" width="100%" height="100%">
    <feFlood flood-color="#e8100c"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="8" height="16" fill="#e8100c"/>
  </pattern>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M64 0H0V64" fill="none" stroke="rgba(242, 240, 236, 0.065)" stroke-width="1"/>
  </pattern>
  <radialGradient id="topGlow" cx="50%" cy="-5%" r="60%">
    <stop offset="0" stop-color="#e8100c" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#e8100c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gridFade" cx="50%" cy="30%" r="75%">
    <stop offset="0.45" stop-color="#fff"/>
    <stop offset="1" stop-color="#000"/>
  </radialGradient>
  <mask id="gridMask"><rect width="100%" height="100%" fill="url(#gridFade)"/></mask></defs>
<style>
  .enter { animation: enter 700ms cubic-bezier(0.23, 1, 0.32, 1) var(--d, 0ms) both; }
  .neon { animation: neonOn 1300ms linear var(--d, 0ms) backwards; }
  .frame-on { animation: frameOn 900ms linear var(--d, 150ms) backwards; }
  .rise { animation: rise 700ms cubic-bezier(0.23, 1, 0.32, 1) 100ms both; }
  .rule { transform-box: fill-box; transform-origin: left center; animation: rule 900ms cubic-bezier(0.77, 0, 0.175, 1) 200ms both; }
  .fade { animation: fade 500ms ease var(--d, 500ms) both; }
  .blink { animation: blink 1.6s steps(1) infinite; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } }
  @keyframes rise { from { transform: translateY(110%); } }
  @keyframes rule { from { transform: scaleX(0); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes neonOn {
    0% { opacity: 0.06; filter: none; }
    8% { opacity: 1; }
    11% { opacity: 0.15; }
    19% { opacity: 0.9; }
    22% { opacity: 0.25; filter: none; }
    38%, 100% { opacity: 1; }
  }
  @keyframes frameOn {
    0% { stroke-opacity: 0.2; }
    10% { stroke-opacity: 1; }
    14% { stroke-opacity: 0.25; }
    26% { stroke-opacity: 1; }
    30% { stroke-opacity: 0.35; }
    40%, 100% { stroke-opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .enter, .rise, .rule, .fade { animation: enterFade 700ms ease both; }
    .neon, .frame-on, .blink { animation: none; }
    @keyframes enterFade { from { opacity: 0; } }
  }</style>


